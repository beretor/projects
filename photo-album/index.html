<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Photo de Vacances</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar no-print">
  <div class="brand">📷 Album de vacances</div>
  <div class="actions">
    <button id="addPhotosBtn" class="btn btn-primary">+ Ajouter des photos</button>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button id="printBtn" class="btn">Exporter en PDF</button>
    <button id="resetBtn" class="btn btn-danger">Réinitialiser</button>
  </div>
</header>

<main class="album" id="album">

  <section class="cover">
    <input type="text" id="albumTitle" class="cover-title" placeholder="Titre de l'album (ex: Été en Grèce)" maxlength="60">
    <input type="text" id="albumSubtitle" class="cover-subtitle" placeholder="Dates ou lieu (ex: Juillet 2026 · Cyclades)" maxlength="80">
  </section>

  <section id="dropzone" class="dropzone">
    <p>Glissez-déposez vos photos ici, ou cliquez sur « Ajouter des photos »</p>
  </section>

  <section id="grid" class="grid"></section>

  <p id="emptyState" class="empty-state">Votre album est vide pour l'instant. Ajoutez vos plus beaux souvenirs de vacances !</p>

</main>

<template id="cardTemplate">
  <figure class="card" draggable="true">
    <button class="card-remove no-print" title="Supprimer">&times;</button>
    <div class="card-img-wrap">
      <img class="card-img" alt="">
    </div>
    <figcaption>
      <input type="text" class="card-caption" placeholder="Ajouter une légende..." maxlength="140">
    </figcaption>
  </figure>
</template>

<script src="app.js"></script>
</body>
</html>
