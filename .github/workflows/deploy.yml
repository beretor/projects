name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r bike-size-calculator/. dist/
          mkdir -p dist/photo-album
          cp -r photo-album/. dist/photo-album/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # bike-size-calculator stays at the site root, photo-album is published under /photo-album/
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
